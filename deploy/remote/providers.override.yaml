# Optional: merge LAST, only after remote provider access and usage are approved.
# Saved-work deployment needs neither of these secret files nor a Meterless host.
services:
  backend:
    environment:
      NEXTWISE_REQUIRE_METERLESS: "true"
      NEXTWISE_PROJECT_PROVIDERS_ENABLED: ${NEXTWISE_PROJECT_PROVIDERS_ENABLED:-false}
      TAVILY_API_KEY_FILE: /run/secrets/tavily_api_key
      NEXTWISE_METERLESS_TOKEN_FILE: /run/secrets/meterless_token
    secrets:
      - tavily_api_key
      - meterless_token
secrets:
  tavily_api_key:
    file: ${NEXTWISE_TAVILY_SECRET_FILE:?Set a private existing Tavily secret-file path}
  meterless_token:
    file: ${NEXTWISE_METERLESS_SECRET_FILE:?Set a private existing Meterless token-file path}
